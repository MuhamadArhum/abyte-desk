<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>AByte ERP — Connecting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: .5px;
    }
    .logo span { color: #3b82f6; }

    .spinner {
      width: 42px; height: 42px;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .label {
      font-size: 15px;
      color: #94a3b8;
    }

    .url {
      font-size: 13px;
      font-family: monospace;
      color: #60a5fa;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="logo">A<span>Byte</span> ERP</div>
<div class="spinner"></div>
<div class="label">Connecting to server…</div>
<div class="url" id="url-label">—</div>

<script src="connecting.js"></script>
</body>
</html>
