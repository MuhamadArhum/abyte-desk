<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>AByte ERP Client — Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 32px 36px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .logo span { color: #3b82f6; }

    h2 { font-size: 15px; color: #94a3b8; font-weight: 400; margin-bottom: 28px; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #64748b;
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1e293b;
    }

    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px 13px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 7px;
      color: #f1f5f9;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #3b82f6; }

    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .row > div.port-col { flex: 0 0 110px; }

    .hint { font-size: 11px; color: #475569; margin-top: -12px; margin-bottom: 14px; }

    .actions { display: flex; gap: 10px; margin-top: 4px; }

    .btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-test    { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-connect { background: #3b82f6; color: #fff; }
    .btn-test:hover { background: #334155; }

    .msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 13px;
      display: none;
    }
    .msg.success { background: #14532d; color: #4ade80; display: block; }
    .msg.error   { background: #450a0a; color: #f87171; display: block; }
    .msg.info    { background: #1e3a5f; color: #93c5fd; display: block; }

    .autostart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 16px;
    }
    .toggle { position: relative; display: inline-block; width: 38px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #334155; border-radius: 20px; cursor: pointer; transition: .2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #3b82f6; }
    input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>

<div class="logo">A<span>Byte</span> ERP Client</div>
<h2>Enter your server's IP address to connect.</h2>

<div class="section-title">Server Connection</div>

<div class="row">
  <div>
    <label>Server IP Address</label>
    <input id="server-ip" type="text" placeholder="e.g. 192.168.1.100" autocomplete="off" />
  </div>
  <div class="port-col">
    <label>Port</label>
    <input id="server-port" type="number" value="5000" placeholder="5000" min="1" max="65535" />
  </div>
</div>
<p class="hint">The IP address shown on the server PC's AByte ERP Server dashboard.</p>

<div class="actions">
  <button class="btn btn-test"    id="btn-test">Test Connection</button>
  <button class="btn btn-connect" id="btn-connect">Connect</button>
</div>

<div class="msg" id="msg"></div>

<div class="autostart-row">
  <span>Start with Windows</span>
  <label class="toggle">
    <input type="checkbox" id="autostart-check" />
    <span class="slider"></span>
  </label>
</div>

<script src="setup.js"></script>
</body>
</html>
