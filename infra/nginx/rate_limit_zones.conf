# Include this file inside the http { } block of /etc/nginx/nginx.conf
# sudo nano /etc/nginx/nginx.conf  →  add:  include /etc/nginx/rate_limit_zones.conf;

limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/s;
limit_req_zone $binary_remote_addr zone=uploads:5m  rate=5r/m;
limit_req_status 429;
