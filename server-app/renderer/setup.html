<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>AByte ERP Server — Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      padding: 24px 28px 28px;
      overflow-y: auto;
    }

    h1 { font-size: 18px; color: #0f172a; margin-bottom: 3px; }
    .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }

    .mariadb-banner {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .mariadb-banner .icon { font-size: 18px; flex-shrink: 0; line-height: 1.4; }
    .mariadb-banner .text { font-size: 12px; color: #92400e; line-height: 1.6; }
    .mariadb-banner .text strong { color: #78350f; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #94a3b8;
      margin: 16px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      color: #0f172a;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }

    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    .btn-row { display: flex; gap: 8px; margin-top: 6px; }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-test  { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .btn-test:hover:not(:disabled) { background: #dbeafe; }
    .btn-init  { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .btn-init:hover:not(:disabled) { background: #dcfce7; }
    .btn-save  { background: #2563eb; color: #fff; }
    .btn-save:hover:not(:disabled) { opacity: .9; }

    .btn-save-full {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      transition: opacity .15s;
    }
    .btn-save-full:hover:not(:disabled) { opacity: .9; }
    .btn-save-full:disabled { opacity: .4; cursor: not-allowed; }

    .msg {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 12px;
      display: none;
      line-height: 1.5;
    }
    .msg.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; display: block; }
    .msg.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
    .msg.info    { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; display: block; }

    .hint { font-size: 11px; color: #94a3b8; margin-top: -10px; margin-bottom: 14px; }
    .jwt-row { display: flex; gap: 8px; align-items: flex-start; }
    .jwt-row input { margin-bottom: 0; }
    .btn-gen {
      padding: 9px 12px;
      background: #ffffff;
      color: #64748b;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
      height: 38px;
    }
    .btn-gen:hover { background: #f1f5f9; }

    .step-badge {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      line-height: 18px;
      margin-right: 6px;
    }

    /* ── MariaDB Step ── */
    #mariadb-step { margin-bottom: 4px; }

    .mariadb-status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .mariadb-status-row .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .mariadb-status-row.checking  { border-color: #e2e8f0; }
    .mariadb-status-row.installed { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
    .mariadb-status-row.missing   { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
    .dot-checking  { background: #94a3b8; animation: pulse 1s infinite; }
    .dot-installed { background: #22c55e; }
    .dot-missing   { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .btn-install-mariadb {
      width: 100%;
      padding: 10px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      margin-bottom: 10px;
    }
    .btn-install-mariadb:disabled { opacity: .4; cursor: not-allowed; }
    .btn-install-mariadb:hover:not(:disabled) { opacity: .88; }

    .progress-wrap {
      display: none;
      margin-bottom: 10px;
    }
    .progress-bar-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #7c3aed;
      border-radius: 3px;
      transition: width .3s ease;
      width: 0%;
    }
    .progress-label { font-size: 11px; color: #64748b; }

    #db-form { display: none; }
  </style>
</head>
<body>

<h1>Server Configuration</h1>
<p class="subtitle">First-time setup: install MariaDB, then configure your database.</p>

<!-- Step 0: MariaDB -->
<div id="mariadb-step">
  <div class="section-title"><span class="step-badge">1</span>Database Engine (MariaDB)</div>

  <div class="mariadb-status-row checking" id="mariadb-status-row">
    <div class="dot dot-checking" id="mariadb-dot"></div>
    <span id="mariadb-status-text">Checking for MariaDB...</span>
  </div>

  <button class="btn-install-mariadb" id="btn-install-mariadb" style="display:none">
    Download &amp; Install MariaDB 10.11 LTS
  </button>

  <div class="progress-wrap" id="mariadb-progress-wrap">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="mariadb-progress-fill"></div>
    </div>
    <div class="progress-label" id="mariadb-progress-label">Downloading...</div>
  </div>

  <div class="msg" id="msg-mariadb"></div>
</div>

<!-- Step 1: DB Config (hidden until MariaDB is confirmed) -->
<div id="db-form">
<div class="section-title"><span class="step-badge">2</span>Database Connection</div>

<div class="row">
  <div>
    <label>Host</label>
    <input id="db-host" type="text" value="localhost" placeholder="localhost" />
  </div>
  <div>
    <label>Port</label>
    <input id="db-port" type="text" value="3306" placeholder="3306" />
  </div>
</div>

<label>Database User</label>
<input id="db-user" type="text" value="root" placeholder="root" />

<label>Database Password</label>
<input id="db-pass" type="password" placeholder="Enter MariaDB root password" />

<label>ERP Database Name</label>
<input id="db-name" type="text" value="abyte_pos" placeholder="abyte_pos" />

<div class="btn-row">
  <button class="btn btn-test" id="btn-test">Test Connection</button>
  <button class="btn btn-init" id="btn-init">Initialize Database</button>
</div>

<div class="msg" id="msg-db"></div>

<div class="section-title"><span class="step-badge">2</span>Security</div>

<label>JWT Secret Key</label>
<div class="jwt-row">
  <input id="jwt-secret" type="text" placeholder="Auto-generated if left empty" />
  <button class="btn-gen" id="btn-gen">Generate</button>
</div>
<p class="hint" style="margin-top:6px;margin-bottom:18px">Leave empty to auto-generate a secure key on save.</p>

<button class="btn-save-full" id="btn-save">Save &amp; Start Server</button>

<div class="msg" id="msg-save"></div>
</div><!-- /db-form -->

<script src="setup.js"></script>
</body>
</html>
