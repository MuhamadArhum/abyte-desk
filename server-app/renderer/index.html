<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>AByte ERP Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #ffffff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    header .brand { font-size: 16px; font-weight: 700; color: #0f172a; letter-spacing: .3px; }
    header .brand span { color: #2563eb; }
    header .ver { font-size: 11px; color: #94a3b8; }

    /* ── Main layout ── */
    .body { display: flex; flex: 1; overflow: hidden; }

    /* ── Left panel ── */
    .left {
      width: 280px;
      padding: 20px;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }

    /* Status card */
    .status-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    .dot-running  { background: #22c55e; box-shadow: 0 0 8px #22c55e66; }
    .dot-starting { background: #f59e0b; box-shadow: 0 0 8px #f59e0b66; animation: pulse .8s infinite alternate; }
    .dot-stopped  { background: #cbd5e1; }
    .dot-error    { background: #ef4444; box-shadow: 0 0 8px #ef444466; }

    @keyframes pulse { to { opacity: .4; } }

    .status-label { font-size: 15px; font-weight: 600; vertical-align: middle; color: #0f172a; }
    .status-sublabel { font-size: 11px; color: #94a3b8; margin-top: 6px; }

    /* IP block */
    .ip-block {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .ip-block .label { font-size: 11px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .ip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background .15s;
    }
    .ip-row:hover { background: #eff6ff; border-color: #bfdbfe; }
    .ip-addr { font-size: 14px; font-weight: 700; color: #2563eb; font-family: monospace; }
    .ip-port { font-size: 12px; color: #94a3b8; }
    .ip-copy { font-size: 10px; color: #94a3b8; }
    .no-ip { font-size: 12px; color: #94a3b8; text-align: center; padding: 8px 0; }

    /* Buttons */
    .btn {
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-start  { background: #22c55e; color: #fff; }
    .btn-stop   { background: #ef4444; color: #fff; }
    .btn-open   { background: #2563eb; color: #fff; margin-top: 2px; }
    .btn-setup  { background: #ffffff; color: #64748b; border: 1px solid #e2e8f0; margin-top: 2px; }
    .btn-setup:hover { background: #f1f5f9; }

    /* Autostart toggle */
    .autostart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #64748b;
    }
    .toggle { position: relative; display: inline-block; width: 38px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #e2e8f0; border-radius: 20px; cursor: pointer;
      transition: .2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%;
      transition: .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    input:checked + .slider { background: #22c55e; }
    input:checked + .slider:before { transform: translateX(18px); }

    /* ── Right panel (logs) ── */
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
    }
    .log-header {
      padding: 14px 18px 10px;
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      background: #ffffff;
    }
    .log-clear { cursor: pointer; color: #94a3b8; font-size: 11px; }
    .log-clear:hover { color: #64748b; }
    #log-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 18px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      background: #fafafa;
    }
    #log-list::-webkit-scrollbar { width: 6px; }
    #log-list::-webkit-scrollbar-track { background: transparent; }
    #log-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
    .log-entry { padding: 1px 0; }
    .log-time  { color: #94a3b8; margin-right: 8px; }
    .log-info    { color: #475569; }
    .log-error   { color: #dc2626; }
    .log-warn    { color: #d97706; }
    .log-success { color: #16a34a; }
    .empty-log { color: #94a3b8; font-size: 12px; text-align: center; margin-top: 40px; }
  </style>
</head>
<body>

<header>
  <div class="brand">A<span>Byte</span> ERP Server</div>
  <div class="ver">v1.0.0</div>
</header>

<div class="body">
  <!-- Left Panel -->
  <div class="left">

    <!-- Status Card -->
    <div class="status-card">
      <div>
        <span class="status-dot dot-stopped" id="status-dot"></span>
        <span class="status-label" id="status-label">Stopped</span>
      </div>
      <div class="status-sublabel" id="status-sub">Server is not running</div>
    </div>

    <!-- IP Block -->
    <div class="ip-block">
      <div class="label">Client Connection Address</div>
      <div id="ip-list"><div class="no-ip">No network found</div></div>
    </div>

    <!-- Action Buttons -->
    <button class="btn btn-start" id="btn-toggle">Start Server</button>
    <button class="btn btn-open"  id="btn-open"  disabled>Open in Browser</button>
    <button class="btn btn-setup" id="btn-setup">⚙ Settings</button>

    <!-- Autostart -->
    <div class="autostart-row">
      <span>Start with Windows</span>
      <label class="toggle">
        <input type="checkbox" id="autostart-check" />
        <span class="slider"></span>
      </label>
    </div>

  </div>

  <!-- Right Panel (Logs) -->
  <div class="right">
    <div class="log-header">
      <span>Server Logs</span>
      <span class="log-clear" id="btn-clear">Clear</span>
    </div>
    <div id="log-list">
      <div class="empty-log" id="empty-log">Logs will appear here when server starts...</div>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
