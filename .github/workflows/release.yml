name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build Installers (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Backend deps (bundled inside server installer) ──────────
      - name: Install backend dependencies
        working-directory: main-app/backend
        run: npm ci --omit=dev

      # ── Build Frontend (bundled inside server installer) ─────────
      - name: Install frontend dependencies
        working-directory: main-app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: main-app/frontend
        run: npm run build

      # ── Build Server App ─────────────────────────────────────────
      - name: Install server-app dependencies
        working-directory: server-app
        run: npm ci

      - name: Build Server installer
        working-directory: server-app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build Client App ─────────────────────────────────────────
      - name: Install client-app dependencies
        working-directory: client-app
        run: npm ci

      - name: Build Client installer
        working-directory: client-app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
