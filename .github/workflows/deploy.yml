name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Deploy Main App ───────────────────────────────────────────
  deploy-main:
    name: Deploy — Main App
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          port:        ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/AByte-POS
            git checkout -- main-app/frontend/package-lock.json 2>/dev/null || true
            git checkout -- admin-panel/frontend/package-lock.json 2>/dev/null || true
            bash main-app/deploy.sh

  # ── Deploy Admin Panel ────────────────────────────────────────
  deploy-admin:
    name: Deploy — Admin Panel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          port:        ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/AByte-POS
            git checkout -- main-app/frontend/package-lock.json 2>/dev/null || true
            git checkout -- admin-panel/frontend/package-lock.json 2>/dev/null || true
            bash admin-panel/deploy.sh
