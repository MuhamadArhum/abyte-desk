name: Deploy to VPS

on:
  push:
    branches: [main]

# Cancel any in-progress deploy if a new push comes in
concurrency:
  group: deploy-production
  cancel-in-progress: false   # don't cancel — queue instead (safe for DB migrations)

jobs:
  # ── 1. Detect what changed ────────────────────────────────────
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      main-app:    ${{ steps.filter.outputs.main-app }}
      admin-panel: ${{ steps.filter.outputs.admin-panel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            main-app:
              - 'main-app/**'
              - 'database/**'
            admin-panel:
              - 'admin-panel/**'
              - 'database/**'

  # ── 2. CI gate (must pass before deploy) ─────────────────────
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: main-app/frontend/package-lock.json

      - name: Install main-app frontend deps
        working-directory: main-app/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: main-app/frontend
        run: npx tsc --noEmit

      - name: Build main-app frontend (smoke test)
        working-directory: main-app/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5000' }}

  # ── 3. Deploy Main App ────────────────────────────────────────
  deploy-main:
    name: Deploy — Main App
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: needs.changes.outputs.main-app == 'true'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          port:        ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/AByte-POS

            echo "→ Resetting auto-generated lock files to avoid merge conflicts..."
            git checkout -- main-app/frontend/package-lock.json 2>/dev/null || true
            git checkout -- admin-panel/frontend/package-lock.json 2>/dev/null || true

            echo "→ Running main-app deploy script..."
            bash main-app/deploy.sh

  # ── 4. Deploy Admin Panel ─────────────────────────────────────
  deploy-admin:
    name: Deploy — Admin Panel
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: needs.changes.outputs.admin-panel == 'true'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          port:        ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/AByte-POS

            echo "→ Resetting auto-generated lock files..."
            git checkout -- main-app/frontend/package-lock.json 2>/dev/null || true
            git checkout -- admin-panel/frontend/package-lock.json 2>/dev/null || true

            echo "→ Running admin-panel deploy script..."
            bash admin-panel/deploy.sh

  # ── 5. Notify on failure ──────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy-main, deploy-admin]
    if: failure()
    steps:
      - name: Deployment failed
        run: |
          echo "::error::Deployment failed! Check logs above."
          exit 1
