name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: main-app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax check all JS files
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./backups/*" \
            -not -path "./logs/*" \
            | xargs -I{} node --check {}

  frontend:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-app/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: main-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
