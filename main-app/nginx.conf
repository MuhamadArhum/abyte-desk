# ─── AByte Main App — Production Nginx Config ─────────────────────────────
# Handles:
#   - HTTP → HTTPS redirect
#   - HTTPS with HTTP/2
#   - Gzip compression
#   - Security headers (HSTS, CSP, X-Frame-Options)
#   - Rate limiting (login, API, uploads)
#   - Static asset caching (1 year, immutable)
#   - Reverse proxy to Node.js backend
#   - Large upload support (5MB logos)
#
# Prerequisites:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
#
# Replace YOUR_DOMAIN with actual domain. SSL paths below are Let's Encrypt defaults.

# ── Rate-limit zones (defined in http block — include in /etc/nginx/nginx.conf) ──
# Add these to /etc/nginx/nginx.conf inside the http { } block:
#
#   limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/s;
#   limit_req_zone $binary_remote_addr zone=uploads:5m rate=5r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Allow Let's Encrypt HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name YOUR_DOMAIN;

    # ── SSL / TLS ───────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;

    # ── Security Headers ────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;
    # CSP is also set by Helmet in the Node.js app; this adds a network-level backstop
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

    # ── Gzip ───────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/rss+xml
        image/svg+xml font/ttf font/otf application/font-woff application/font-woff2;

    # ── Request size ───────────────────────────────────────────
    client_max_body_size    5m;   # logo uploads
    client_body_buffer_size 128k;

    # ── Static assets (SPA dist) ────────────────────────────────
    root  /var/www/AByte-POS/main-app/frontend/dist;
    index index.html;

    location ~* \.(js|css|woff2|woff|ttf|otf|ico|png|jpg|jpeg|svg|webp|gif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Uploads (logos, etc.) ───────────────────────────────────
    location /uploads/ {
        alias  /var/www/AByte-POS/main-app/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── API rate limiting ───────────────────────────────────────
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        include            /etc/nginx/proxy_params;
    }

    location ~* ^/api/(auth/forgot-password|auth/reset-password) {
        limit_req zone=login burst=2 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        include            /etc/nginx/proxy_params;
    }

    location /api/settings/upload-logo {
        limit_req          zone=uploads burst=3 nodelay;
        client_max_body_size 5m;
        proxy_pass         http://127.0.0.1:5000;
        proxy_read_timeout 30s;
        include            /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req          zone=api burst=50 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_read_timeout 120s;   # AI/report endpoints can be slow
        proxy_send_timeout 30s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
        include            /etc/nginx/proxy_params;
    }

    # ── SPA fallback ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
